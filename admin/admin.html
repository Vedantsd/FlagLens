<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FlagLens — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header>
  <a class="logo" href="#">
    <img class="logo-icon" src="src/logo.png" alt="FlagLens logo">
    <span class="logo-text">FlagLens</span>
  </a>
  <span class="header-tag">Admin</span>
</header>

<main>
  <div class="container">

    <div class="admin-header">
      <div>
        <h1>Evaluation results</h1>
        <div class="admin-sub" id="results-count">Loading…</div>
      </div>
      <button class="btn-refresh" id="btn-refresh">Refresh</button>
    </div>

    <div class="stat-strip">
      <div class="stat"><div class="stat-label">Total evaluations</div><div class="stat-value" id="stat-total">—</div></div>
      <div class="stat"><div class="stat-label">Green flag</div><div class="stat-value" id="stat-green">—</div></div>
      <div class="stat"><div class="stat-label">Red flag</div><div class="stat-value" id="stat-red">—</div></div>
      <div class="stat"><div class="stat-label">Average score</div><div class="stat-value" id="stat-avg">—</div></div>
    </div>

    <div class="toolbar">
      <input type="text" class="search-input" id="search-input" placeholder="Filter by evaluator or friend name…">
    </div>

    <div class="table-wrap">
      <table id="results-table">
        <thead>
          <tr>
            <th data-key="userName">Evaluator</th>
            <th data-key="friendName">Friend</th>
            <th data-key="timestamp" class="sorted">Date</th>
            <th data-key="score">Score</th>
            <th data-key="flagStatus">Flag</th>
          </tr>
        </thead>
        <tbody id="results-body">
          <tr><td colspan="5" class="loading-state">Loading results…</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</main>

<footer>
  FlagLens — Admin Dashboard
</footer>

<script>
  let allResults = [];
  let sortKey = "timestamp";
  let sortDir = "desc";

  const els = {
    count: document.getElementById("results-count"),
    body: document.getElementById("results-body"),
    search: document.getElementById("search-input"),
    refresh: document.getElementById("btn-refresh"),
    statTotal: document.getElementById("stat-total"),
    statGreen: document.getElementById("stat-green"),
    statRed: document.getElementById("stat-red"),
    statAvg: document.getElementById("stat-avg"),
    headers: document.querySelectorAll("#results-table thead th")
  };

  function formatDate(isoString) {
    if (!isoString) return "—";
    const date = new Date(isoString);
    return date.toLocaleString(undefined, {
      year: "numeric", month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
  }

  function renderStats(results) {
    const total = results.length;
    const green = results.filter(r => r.flagStatus === "green").length;
    const red = results.filter(r => r.flagStatus === "red").length;
    const avg = total ? results.reduce((sum, r) => sum + r.score, 0) / total : 0;

    els.statTotal.textContent = total;
    els.statGreen.textContent = green;
    els.statRed.textContent = red;
    els.statAvg.textContent = total ? avg.toFixed(2) : "—";
  }

  function renderTable() {
    const query = els.search.value.trim().toLowerCase();
    let filtered = allResults.filter(r =>
      !query ||
      r.userName.toLowerCase().includes(query) ||
      r.friendName.toLowerCase().includes(query)
    );

    filtered = [...filtered].sort((a, b) => {
      let av = a[sortKey];
      let bv = b[sortKey];
      if (sortKey === "timestamp") { av = new Date(av).getTime(); bv = new Date(bv).getTime(); }
      if (typeof av === "string") { av = av.toLowerCase(); bv = bv.toLowerCase(); }
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });

    els.count.textContent = `${filtered.length} of ${allResults.length} result${allResults.length === 1 ? "" : "s"}`;

    if (filtered.length === 0) {
      els.body.innerHTML = '<tr><td colspan="5" class="empty-state">No results match.</td></tr>';
      return;
    }

    els.body.innerHTML = filtered.map(r => `
      <tr>
        <td>${escapeHtml(r.userName)}</td>
        <td>${escapeHtml(r.friendName)}</td>
        <td>${formatDate(r.timestamp)}</td>
        <td>${r.score.toFixed(2)}</td>
        <td>
          <span class="flag-pill ${r.flagStatus}">
            <span class="flag-dot"></span>${r.flagStatus === "green" ? "Green" : "Red"}
          </span>
        </td>
      </tr>
    `).join("");
  }

  async function loadResults() {
    els.refresh.disabled = true;
    els.refresh.textContent = "Refreshing…";
    els.body.innerHTML = '<tr><td colspan="5" class="loading-state">Loading results…</td></tr>';

    try {
      const response = await fetch("/api/admin/results");
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      allResults = data.results || [];
      renderStats(allResults);
      renderTable();
    } catch (error) {
      console.error("Failed to load results:", error);
      els.body.innerHTML = '<tr><td colspan="5" class="error-state">Could not load results. Check the server is running and try refreshing.</td></tr>';
      els.count.textContent = "Error loading results";
    } finally {
      els.refresh.disabled = false;
      els.refresh.textContent = "Refresh";
    }
  }

  els.search.addEventListener("input", renderTable);
  els.refresh.addEventListener("click", loadResults);

  els.headers.forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (sortKey === key) {
        sortDir = sortDir === "asc" ? "desc" : "asc";
      } else {
        sortKey = key;
        sortDir = key === "timestamp" ? "desc" : "asc";
      }
      els.headers.forEach(h => h.classList.remove("sorted"));
      th.classList.add("sorted");
      renderTable();
    });
  });

  loadResults();
</script>

</body>
</html>
