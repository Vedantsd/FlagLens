<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FlagLens</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="style.css">

</head>
<body>

<header>
  <a class="logo" href="#">
    <svg class="logo-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="14" cy="14" r="13" stroke="#3a7bd5" stroke-width="1.5"/>
      <path d="M9 14 L13 18 L19 10" stroke="#3a7bd5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">FlagLens</span>
  </a>
  <span class="header-tag">Habit Evaluator</span>
</header>

<main>
  <div class="container">

    <div id="screen-name" class="screen active">
      <div class="step-label">Step 1 of 2</div>
      <h1>Who are we evaluating?</h1>
      <p class="subtitle">Enter your friend's name to begin. You'll answer a randomized set of questions about their habits.</p>
      <div class="input-group">
        <label for="friend-name-input">Friend's name</label>
        <input type="text" id="friend-name-input" placeholder="Enter name" autocomplete="off" maxlength="40">
      </div>
      <button class="btn-primary" id="btn-start">Continue</button>
      <div id="load-status" style="font-size:12px;color:var(--text-muted);margin-top:10px;"></div>
    </div>

    <div id="screen-questions" class="screen">
      <div class="progress-bar-wrap">
        <div class="progress-meta">
          <span class="progress-count" id="progress-count">Question 1</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
        </div>
      </div>
      <div class="friend-label">Evaluating</div>
      <div class="friend-name-display" id="friend-display"></div>
      <div class="question-text" id="question-text"></div>
      <div class="answer-btns">
        <button class="answer-btn btn-yes" id="btn-yes">
          <div class="btn-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M4 9 L7.5 12.5 L14 6" stroke="#2db56e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="btn-label">Yes</span>
        </button>
        <button class="answer-btn btn-no" id="btn-no">
          <div class="btn-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M5.5 5.5 L12.5 12.5 M12.5 5.5 L5.5 12.5" stroke="#e03535" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="btn-label">No</span>
        </button>
      </div>
    </div>

    <div id="screen-result" class="screen result-section">
      <div class="score-ring-wrap">
        <div class="score-ring">
          <svg id="score-svg" width="120" height="120" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="50" fill="none" stroke="#1f3050" stroke-width="8"/>
            <circle id="score-arc" cx="60" cy="60" r="50" fill="none" stroke-width="8"
              stroke-linecap="round"
              stroke-dasharray="314"
              stroke-dashoffset="314"
              transform="rotate(-90 60 60)"
              style="transition: stroke-dashoffset 1s ease, stroke 1s ease;"/>
          </svg>
          <div class="score-ring-label">
            <span class="score-number" id="score-display">0.0</span>
            <span class="score-sub">Score</span>
          </div>
        </div>
      </div>
      <div class="result-name" id="result-name-label"></div>
      <div class="result-verdict" id="result-verdict"></div>
      <div class="result-desc" id="result-desc"></div>
      <div class="suggestions-box" id="suggestions-box">
        <div class="suggestions-title">Areas to improve</div>
        <div id="suggestions-list"></div>
      </div>
      <button class="btn-download" id="btn-download">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 2 L8 10 M5 7 L8 10 L11 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 13 L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Download Card
      </button>
      <button class="btn-restart" id="btn-restart">Evaluate Someone Else</button>
    </div>

  </div>
</main>

<footer>
  FlagLens — Habit Evaluation Tool
</footer>

<div id="export-card">
  <div class="card-inner">
    <div class="card-top-bar" id="card-top-bar"></div>
    <div class="card-meta">FlagLens Report</div>
    <div class="card-friend-name" id="card-name"></div>
    <div class="card-verdict-row">
      <div class="card-verdict-badge" id="card-badge"></div>
      <div class="card-score-chip" id="card-score-chip"></div>
    </div>
    <div class="card-divider"></div>
    <div class="card-suggestions-heading">Areas to improve</div>
    <div id="card-suggestions"></div>
  </div>
  <div class="card-footer">
    <span class="card-footer-brand">FlagLens</span>
    <span class="card-footer-date" id="card-date"></span>
  </div>
</div>
